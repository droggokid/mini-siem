services:
  api:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      USERS_DB_PATH: /data/users.db
    volumes:
      - users-data:/data
    networks:
      - default
      - backend

  event:
    build:
      context: .
      dockerfile: cmd/event/Dockerfile
    networks:
      - backend

  detection:
    build:
      context: .
      dockerfile: cmd/detection/Dockerfile
    networks:
      - backend

volumes:
  users-data: {}

networks:
  default: {}
  backend:
    internal: true
