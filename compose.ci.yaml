# CI-only overrides; local development keeps compose.yaml unchanged.
services:
  api:
    ports: !override
      - '127.0.0.1::8080'
    environment:
      GIN_MODE: release
  event:
    environment:
      GIN_MODE: release
    healthcheck: &healthcheck
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
  detection:
    environment:
      GIN_MODE: release
    healthcheck: *healthcheck
